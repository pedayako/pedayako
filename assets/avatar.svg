<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="mascote de Pedro">
  <defs>
    <style>
      .sparkle { animation: twinkle 2.6s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% {opacity:.25} 50% {opacity:1} }
      @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
    </style>
    <clipPath id="type1"><rect x="110" y="116" width="0" height="18"><animate attributeName="width" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.4;0.5;1" values="0;36;36;0;0"/></rect></clipPath>
    <clipPath id="type2"><rect x="110" y="116" width="0" height="18"><animate attributeName="width" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.625;0.9;1" values="0;0;74;74;0"/></rect></clipPath>
  </defs>

  <rect width="300" height="300" rx="12" fill="#14110D"/>

  <!-- sparkles -->
  <path class="sparkle" d="M248,44 L251,52 L259,55 L251,58 L248,66 L245,58 L237,55 L245,52 Z" fill="#F2E8D5" style="animation-delay:.3s"/>
  <path class="sparkle" d="M268,68 L270,73 L275,75 L270,77 L268,82 L266,77 L261,75 L266,73 Z" fill="#F2E8D5" style="animation-delay:1.1s"/>
  <path class="sparkle" d="M232,74 L233,77 L236,78 L233,79 L232,82 L231,79 L228,78 L231,77 Z" fill="#B0532E" style="animation-delay:.7s"/>

  <!-- desk line -->
  <line x1="0" y1="236" x2="300" y2="236" stroke="#2A2419" stroke-width="2"/>

  <!-- monitor -->
  <rect x="80" y="70" width="140" height="100" rx="8" fill="#F2E8D5"/>
  <rect x="92" y="82" width="116" height="70" rx="4" fill="#1F1B14"/>
  <rect x="135" y="170" width="30" height="16" fill="#F2E8D5"/>
  <rect x="108" y="184" width="84" height="9" rx="3" fill="#F2E8D5"/>

  <!-- terminal screen -->
  <text x="98" y="100" font-family="'Courier New',ui-monospace,monospace" font-size="9" fill="#5C5442">$ ./hello.sh</text>
  <text x="98" y="128" font-family="'Courier New',ui-monospace,monospace" font-size="12" fill="#6B7A5E">&gt;</text>
  <g clip-path="url(#type1)"><text x="110" y="128" font-family="'Courier New',ui-monospace,monospace" font-size="12" fill="#F2E8D5">oiii_</text></g>
  <g clip-path="url(#type2)"><text x="110" y="128" font-family="'Courier New',ui-monospace,monospace" font-size="12" fill="#F2E8D5">tudo bem?_</text></g>

  <!-- mug -->
  <g>
    <path d="M40,214 Q40,208 46,208 L64,208 Q70,208 70,214 L68,232 Q67,236 63,236 L47,236 Q43,236 42,232 Z" fill="#B0532E"/>
    <path d="M70,214 Q80,214 80,222 Q80,230 70,229" fill="none" stroke="#B0532E" stroke-width="3"/>
    <path d="M48,198 Q52,192 48,186" fill="none" stroke="#7A6F5C" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <path d="M60,198 Q64,192 60,186" fill="none" stroke="#7A6F5C" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
