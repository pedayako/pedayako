  <circle cx="48" cy="24" r="7" fill="#3DD673"/>
  <circle cx="70" cy="24" r="7" fill="#4F86D6"/>
  <text x="600" y="29" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace" font-size="14" fill="#6B7280">pedayako@github:~</text>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#232A35" stroke-width="1"/>

