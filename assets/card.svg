    <clipPath id="ln7"><rect x="48" y="316" width="0" height="24"><animate attributeName="width" to="268" dur="0.8s" begin="4.47s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="ln8"><rect x="48" y="338" width="0" height="42"><animate attributeName="width" to="70" dur="0.2s" begin="5.39s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="ln9"><rect x="48" y="400" width="0" height="24"><animate attributeName="width" to="162" dur="0.48s" begin="5.71s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="ln10"><rect x="48" y="430" width="0" height="26"><animate attributeName="width" to="494" dur="0.8s" begin="6.31s" fill="freeze" calcMode="linear"/></rect></clipPath>
